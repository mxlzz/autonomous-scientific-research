name: H0 cross version scoring for ReAct mock fixture
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/h0-cross-version-scoring.yml
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up immutable Python and sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet uv==0.13.9
          "$HOME/.local/bin/uv" python install 3.11
          git init -q "$RUNNER_TEMP/asta-bench"
          git -C "$RUNNER_TEMP/asta-bench" fetch -q --depth 1 https://github.com/allenai/asta-bench.git b0f436711e052cec1f216c296e804c70e4ec529b
          git -C "$RUNNER_TEMP/asta-bench" checkout -q --detach FETCH_HEAD
          git init -q "$RUNNER_TEMP/agent-baselines"
          git -C "$RUNNER_TEMP/agent-baselines" fetch -q --depth 1 https://github.com/allenai/agent-baselines.git 2d426deac51ad74381319bcfd77066c6e222ba30
          git -C "$RUNNER_TEMP/agent-baselines" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/asta-bench" rev-parse HEAD)" = b0f436711e052cec1f216c296e804c70e4ec529b
          test "$(git -C "$RUNNER_TEMP/agent-baselines" rev-parse HEAD)" = 2d426deac51ad74381319bcfd77066c6e222ba30
          echo IMMUTABLE_UPSTREAM_SOURCES=verified
      - name: Solve one public arithmetic mock sample in original ReAct environment
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/uv" venv --python 3.11 "$RUNNER_TEMP/c1"
          timeout 210 "$HOME/.local/bin/uv" pip install --python "$RUNNER_TEMP/c1/bin/python" "$RUNNER_TEMP/agent-baselines/solvers/react" > "$RUNNER_TEMP/c1-install.log" 2>&1
          mkdir -p "$RUNNER_TEMP/c1-logs"
          cd "$RUNNER_TEMP/agent-baselines"
          set +e
          timeout 145 "$RUNNER_TEMP/c1/bin/inspect" eval astabench/arithmetic_demo --solver agent_baselines/solvers/react/basic_agent.py@instantiated_basic_agent --model mockllm/model --limit 1 --max-samples 1 --no-score --log-format json --log-dir "$RUNNER_TEMP/c1-logs" -S max_steps=2 -S with_search_tools=0 -S with_table_editor=0 -S with_report_editor=0 -S with_thinking_tool=0 > "$RUNNER_TEMP/c1-solve.log" 2>&1
          rc=$?
          set -e
          echo C1_NO_SCORE_EXIT="$rc"
          tail -n 19 "$RUNNER_TEMP/c1-solve.log"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo C1_LOG_FILE_COUNT=$(find "$RUNNER_TEMP/c1-logs" -name '*.json' -type f | wc -l)
      - name: Score the frozen C1 log with isolated AstaBench 0.5.5 scorer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asta-bench"
          set +e
          timeout 285 "$HOME/.local/bin/uv" sync --project solvers/scorer --frozen --python 3.11 > "$RUNNER_TEMP/scorer-install.log" 2>&1
          rc=$?
          set -e
          echo SCORER_ENV_SETUP_EXIT="$rc"
          tail -n 16 "$RUNNER_TEMP/scorer-install.log"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          "$HOME/.local/bin/uv" run --project solvers/scorer --frozen -- python -c 'import importlib.metadata as m; print("SCORER_ASTABENCH="+m.version("astabench")); print("SCORER_INSPECT="+m.version("inspect_ai"))'
          file=$(find "$RUNNER_TEMP/c1-logs" -name '*.json' -type f | head -n 1)
          if [ -z "$file" ]; then echo NO_SOLVE_LOG=true; exit 10; fi
          set +e
          timeout 100 "$HOME/.local/bin/uv" run --project solvers/scorer --frozen -- inspect score --scorer astabench/evals/demo/arithmetic/task.py@check_arithmetic --overwrite "$file" > "$RUNNER_TEMP/scoring.log" 2>&1
          rc=$?
          set -e
          echo CROSS_VERSION_SCORE_EXIT="$rc"
          tail -n 24 "$RUNNER_TEMP/scoring.log"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo CROSS_VERSION_SCORING_COMPATIBLE=true
