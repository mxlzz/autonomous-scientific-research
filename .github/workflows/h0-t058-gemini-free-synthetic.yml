name: H0 T0.58 Gemini free original synthetic calibration (one attempt)

# No push trigger: T0.58 was ONE approved episode; prevent accidental reruns.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t058-gemini-one-synthetic-episode
  cancel-in-progress: false

jobs:
  original-fixture-one-episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout with no persistent GitHub token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify scorer, validators and mock tool flow OFFLINE
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t058_gemini_synthetic.py
          python3 scripts/t058_gemini_synthetic.py --self-test
      - name: One Gemini Free API episode - only fictional newly written data
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          set -euo pipefail
          set +x
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "T058_GATE=BLOCKED_MISSING_GEMINI_API_KEY"
            exit 2
          fi
          if [ "$GEMINI_MODEL" != "gemini-3.8-flash" ]; then
            echo "T058_GATE=BLOCKED_UNAPPROVED_MODEL"
            exit 2
          fi
          echo "T058_MODEL=gemini-3.8-flash"
          echo "T058_DATA=ONLY_ORIGINAL_SYNTHETIC"
          echo "T058_MAX_MODEL_REQUESTS=3"
          echo "T058_MAX_MEASUREMENTS=2"
          # Stdout from the controller is strictly allowlisted JSON; no raw model text.
          python3 scripts/t058_gemini_synthetic.py --run
