name: H0 dependency preflight Python and uv
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/h0-dependency-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install pinned uv 0.13.9
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet uv==0.13.9
          "$HOME/.local/bin/uv" --version
      - name: Prepare Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/uv" python install 3.11
          "$HOME/.local/bin/uv" python find 3.11
          echo PYTHON311_SETUP=success
      - name: Check immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/asta-bench"
          git -C "$RUNNER_TEMP/asta-bench" fetch -q --depth 1 https://github.com/allenai/asta-bench.git b0f436711e052cec1f216c296e804c70e4ec529b
          git -C "$RUNNER_TEMP/asta-bench" checkout -q --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/asta-bench" rev-parse HEAD
          test "$(git -C "$RUNNER_TEMP/asta-bench" rev-parse HEAD)" = b0f436711e052cec1f216c296e804c70e4ec529b
          echo ASTABENCH_SOURCE_PIN=verified
      - name: Try root requirements resolution without installing
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/uv" venv --python 3.11 "$RUNNER_TEMP/h0-venv"
          set +e
          timeout 180 "$HOME/.local/bin/uv" pip install --dry-run --python "$RUNNER_TEMP/h0-venv/bin/python" "$RUNNER_TEMP/asta-bench" > "$RUNNER_TEMP/resolve.log" 2>&1
          rc=$?
          set -e
          echo RESOLUTION_RC="$rc"
          tail -n 20 "$RUNNER_TEMP/resolve.log"
          echo RESOLUTION_CHECK_FINISHED=true
      - name: Install isolated AstaBench package without credentials
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 360 "$HOME/.local/bin/uv" pip install --python "$RUNNER_TEMP/h0-venv/bin/python" "$RUNNER_TEMP/asta-bench" > "$RUNNER_TEMP/install.log" 2>&1
          rc=$?
          set -e
          echo PACKAGE_INSTALL_EXIT_CODE="$rc"
          tail -n 25 "$RUNNER_TEMP/install.log"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          "$RUNNER_TEMP/h0-venv/bin/python" -c 'import importlib.metadata as m; print("ASTABENCH_INSTALLED=" + m.version("astabench")); print("INSPECT_AI_INSTALLED=" + m.version("inspect_ai"))'
          "$RUNNER_TEMP/h0-venv/bin/python" -m pip --version 2>/dev/null || true
          "$HOME/.local/bin/uv" pip freeze --python "$RUNNER_TEMP/h0-venv/bin/python" > "$RUNNER_TEMP/resolved.txt"
          sha256sum "$RUNNER_TEMP/resolved.txt"
          echo PACKAGE_INSTALL_VALIDATED=true
      - name: Smoke test public arithmetic fixture with local mock model
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 180 "$RUNNER_TEMP/h0-venv/bin/inspect" eval astabench/arithmetic_demo --model mockllm/model --solver generate --limit 1 --max-samples 1 --log-format json --log-dir "$RUNNER_TEMP/demo-logs" > "$RUNNER_TEMP/smoke.log" 2>&1
          rc=$?
          set -e
          echo ARITHMETIC_MOCK_SMOKE_EXIT="$rc"
          tail -n 45 "$RUNNER_TEMP/smoke.log"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo ARITHMETIC_MOCK_SMOKE_SUCCESS=true
