name: H0 dependency preflight Python and uv
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/h0-dependency-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install pinned uv 0.13.9
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet uv==0.13.9
          "$HOME/.local/bin/uv" --version
      - name: Prepare Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/uv" python install 3.11
          "$HOME/.local/bin/uv" python find 3.11
          echo PYTHON311_SETUP=success
      - name: Check immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/asta-bench"
          git -C "$RUNNER_TEMP/asta-bench" fetch -q --depth 1 https://github.com/allenai/asta-bench.git b0f436711e052cec1f216c296e804c70e4ec529b
          git -C "$RUNNER_TEMP/asta-bench" checkout -q --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/asta-bench" rev-parse HEAD
          test "$(git -C "$RUNNER_TEMP/asta-bench" rev-parse HEAD)" = b0f436711e052cec1f216c296e804c70e4ec529b
          echo ASTABENCH_SOURCE_PIN=verified
      - name: Try root requirements resolution without installing
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/uv" venv --python 3.11 "$RUNNER_TEMP/h0-venv"
          set +e
          timeout 180 "$HOME/.local/bin/uv" pip install --dry-run --python "$RUNNER_TEMP/h0-venv/bin/python" "$RUNNER_TEMP/asta-bench" > "$RUNNER_TEMP/resolve.log" 2>&1
          rc=$?
          set -e
          echo RESOLUTION_RC="$rc"
          tail -n 20 "$RUNNER_TEMP/resolve.log"
          echo RESOLUTION_CHECK_FINISHED=true
