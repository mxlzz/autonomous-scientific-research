name: H0 T0.9 DiscoveryWorld official API CPU/headless smoke
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/h0-discoveryworld-cpu-preflight.yml
permissions:
  contents: read
concurrency:
  group: h0-t09-discoveryworld-preflight
  cancel-in-progress: true
jobs:
  world:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      HF_TOKEN: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Install pinned public DiscoveryWorld and CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "T09_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -m pip install --user --quiet uv==0.13.9
          "$HOME/.local/bin/uv" python install 3.9
          git init -q "$RUNNER_TEMP/dw-source"
          git -C "$RUNNER_TEMP/dw-source" fetch -q --depth 1 https://github.com/allenai/discoveryworld.git fd591323920be0d3786ef350955de1945aa571e5
          git -C "$RUNNER_TEMP/dw-source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dw-source" rev-parse HEAD)" = fd591323920be0d3786ef350955de1945aa571e5
          echo "T09_SOURCE_PIN=verified"
          "$HOME/.local/bin/uv" venv --python 3.9 "$RUNNER_TEMP/dw-env"
          timeout 240 "$HOME/.local/bin/uv" pip install --python "$RUNNER_TEMP/dw-env/bin/python" "$RUNNER_TEMP/dw-source" > "$RUNNER_TEMP/install-private.log" 2>&1
          "$HOME/.local/bin/uv" pip freeze --python "$RUNNER_TEMP/dw-env/bin/python" | sort > "$RUNNER_TEMP/installed-versions.txt"
          sha256sum "$RUNNER_TEMP/installed-versions.txt" | awk '{print "T09_RESOLUTION_SHA256="$1}'
          "$RUNNER_TEMP/dw-env/bin/python" - <<'PY'
          import importlib.metadata as m, sys
          print("T09_PYTHON="+sys.version.split()[0])
          for p in ("discoveryworld","pygame","numpy","pathfinding"):
              print("T09_PKG_"+p.upper()+"="+m.version(p))
          PY
      - name: Run two fixed instrumental actions on selected development scenario
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dw-source"
          mkdir -p "$RUNNER_TEMP/t09-private"
          # Source may emit verbose hidden-world details: capture locally; never show it publicly.
          set +e
          timeout 130 "$RUNNER_TEMP/dw-env/bin/python" - > "$RUNNER_TEMP/t09-private/runtime.log" 2>&1 <<'PY'
          import hashlib, json, pathlib, resource, time, os, sys
          from discoveryworld.DiscoveryWorldAPI import DiscoveryWorldAPI
          from discoveryworld.ScenarioMaker import SCENARIO_NAMES
          assert "Plant Nutrients" in SCENARIO_NAMES
          print("T09_STAGE=scenario_name_found")
          start=time.monotonic()
          api=DiscoveryWorldAPI(threadID=10919)
          loaded=api.loadScenario(scenarioName="Plant Nutrients", difficultyStr="Normal", randomSeed=0, numUserAgents=1)
          if not loaded:
              raise RuntimeError("scenario_load_failed")
          print("T09_STAGE=scenario_loaded")
          obs=api.getAgentObservation(agentIdx=0)
          initial_counter=api.getStepCounter()
          assert not obs.get("errors") and "ui" in obs
          print("T09_STAGE=observation_ok")
          # Do not make the scorecard available to any agent policy.
          obs_json=json.dumps(obs,sort_keys=True,default=str)
          forbidden=("scoreNormalized","criticalQuestions","scoreCard","maxScore")
          leaked=[k for k in forbidden if k in obs_json]
          assert not leaked, "agent_observation_exposes_evaluator_private_fields"
          print("T09_STAGE=no_score_leak")
          known=api.listKnownActions(limited=False)
          assert "ROTATE_DIRECTION" in known
          print("T09_STAGE=rotation_action_known")
          results=[]
          for direction in ("north","east"):
              response=api.performAgentAction(agentIdx=0,actionJSON={"action":"ROTATE_DIRECTION","arg1":direction})
              assert response.get("success") is True and not response.get("errors"), "scripted_action_failed"
              tick_result=api.tick()
              assert tick_result.get("success") is True, "world_tick_failed"
              results.append(True)
              print("T09_STAGE=action_"+str(len(results))+"_ok")
          # Upstream API refreshes self.steps during getAgentObservation, not tick().
          post_obs=api.getAgentObservation(agentIdx=0)
          assert not post_obs.get("errors"), "post_observation_failed"
          assert api.getStepCounter()-initial_counter==2, "world_tick_delta_mismatch"
          print("T09_STAGE=two_steps_confirmed")
          # Evaluator-only read AFTER actions; do NOT leak subgoals/critical hypotheses.
          scorecard=api.getTaskScorecard()
          assert isinstance(scorecard,list) and len(scorecard)>=1
          print("T09_STAGE=evaluator_scorecard_read")
          score=scorecard[0]
          assert isinstance(score["completedSuccessfully"],bool)
          value=float(score["scoreNormalized"])
          assert 0<=value<=1
          metric={
            "task_theme":"Plant Nutrients",
            "difficulty":"Normal",
            "seed":0,
            "actions_attempted":2,
            "actions_succeeded":len(results),
            "score_type":"simulator_procedural_not_scientific_validity",
            "score_normalized":value,
            "completed_successfully":score["completedSuccessfully"],
            "agent_observation_score_leak":bool(leaked),
            "elapsed_seconds":round(time.monotonic()-start,3),
            "maxrss_kb":resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,
            "source_commit":"fd591323920be0d3786ef350955de1945aa571e5"
          }
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"t09-private"/"allowlisted.json"
          output.write_text(json.dumps(metric,sort_keys=True))
          PY
          rc=$?
          set -e
          echo "T09_SMOKE_CLI_RC=$rc"
          if [ "$rc" -ne 0 ]; then
              echo "T09_SMOKE_RESULT=failed_private_diagnostics_not_published"
              echo "T09_PRIVATE_LOG_SHA256=$(sha256sum "$RUNNER_TEMP/t09-private/runtime.log" | awk '{print $1}')"
          python3 - <<'PY'
          import os,pathlib,re,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"t09-private"/"runtime.log"
          data=p.read_text(errors="replace").splitlines()
          last=data[-1].strip() if data else ""
          match=re.match(r"([A-Za-z_][A-Za-z_0-9.]*?(?:Error|Exception))(?::|$)",last)
          print("T09_EXCEPTION_CLASS="+(match.group(1) if match else "unclassified"))
          safe=("FileNotFoundError","ModuleNotFoundError","ImportError","KeyError","TypeError","ValueError","AssertionError","RuntimeError","pygame.error","display","SDL","sprite","scripted_action_failed","agent_observation_exposes_evaluator_private_fields")
          joined="\n".join(data)
          print("T09_FAILURE_CATEGORIES="+(",".join(k for k in safe if k.lower() in joined.lower()) or "unclassified"))
          print("T09_PRIVATE_LOG_LINECOUNT="+str(len(data)))
          stages=re.findall(r"T09_STAGE=([a-z0-9_]+)",joined)
          print("T09_LAST_COMPLETED_STAGE="+(stages[-1] if stages else "none"))
          frames=re.findall(r'File "<stdin>", line (\d+)',joined)
          print("T09_FAILURE_STDIN_LINE="+(frames[-1] if frames else "none"))
          PY
              exit "$rc"
          fi
          "$RUNNER_TEMP/dw-env/bin/python" - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"t09-private"/"allowlisted.json"
          raw=p.read_bytes()
          d=json.loads(raw)
          assert d["actions_attempted"]==2 and d["actions_succeeded"]==2
          assert d["agent_observation_score_leak"] is False
          print("T09_RESULT=pass")
          print("T09_PUBLIC_SUMMARY_SHA256="+hashlib.sha256(raw).hexdigest())
          for k in ("task_theme","difficulty","seed","actions_attempted","actions_succeeded","score_normalized","completed_successfully","elapsed_seconds","maxrss_kb"):
              print("T09_"+k.upper()+"="+str(d[k]))
          PY
          echo "T09_PRIVATE_LOG_UPLOADED=false"
