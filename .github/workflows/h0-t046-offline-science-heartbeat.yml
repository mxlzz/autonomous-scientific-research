name: H0 T0.46 offline scientific heartbeat and timeout censor fixtures
on:
  push:
    paths:
      - .github/workflows/h0-t046-offline-science-heartbeat.yml
permissions:
  contents: read
concurrency:
  group: h0-t046-one-offline-heartbeat
  cancel-in-progress: true
jobs:
  offline-heartbeat-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check prereg and run pure-Python synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/T0.46-offline-timeout-censor-heartbeat-preregister-2026-11-20.md)" = 627304658f289f6ee20858947a06292d6cdf97d0
          test "$(git hash-object scripts/h0_heartbeat_censor_t046.py)" = 0cea5d9239aec04ce4f646e555d68b4427a29445
          python3 -m py_compile scripts/h0_heartbeat_censor_t046.py
          python3 scripts/h0_heartbeat_censor_t046.py --offline-test
          echo T046_PREREG_AND_SCRIPT_PIN=true
          echo T046_LLM_REQUESTS=0
          echo T046_PRIVATE_TASKS_ACCESSED=false
      - name: Check exact original SciResearch harness and source patch offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t046-upstream"
          git clone -q --filter=blob:none --no-checkout https://github.com/Btwestyo/sciresearch-eval.git "$RUNNER_TEMP/t046-upstream"
          git -C "$RUNNER_TEMP/t046-upstream" fetch -q --depth 1 origin 9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0
          git -C "$RUNNER_TEMP/t046-upstream" checkout --detach -q 9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0
          test "$(git -C "$RUNNER_TEMP/t046-upstream" hash-object src/sciresearch_eval/agents/harness.py)" = 194a4b36caf4cd702caee34044ec457247644aee
          python3 scripts/h0_heartbeat_censor_t046.py --offline-test --source="$RUNNER_TEMP/t046-upstream/src/sciresearch_eval/agents/harness.py"
          echo T046_ORIGINAL_HARNESS_PIN=true
          echo T046_SOURCE_PATCH_CHECK_ONLY=true
          echo T046_NO_SCIENCE_INFERENCE=true
          echo T046_NO_GOLD_ACCESS=true
          echo T046_API_PAID_USD=0
