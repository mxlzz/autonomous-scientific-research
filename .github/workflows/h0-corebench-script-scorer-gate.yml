name: H0 T0.16 frozen CORE capsule static script and synthetic scorer gate
on:
  push:
    paths:
      - .github/workflows/h0-corebench-script-scorer-gate.yml
permissions:
  contents: read
concurrency:
  group: h0-t016-static-scorer-one-shot
  cancel-in-progress: true

jobs:
  static-scientific-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      HF_TOKEN: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Verify pinned CORE archive, inspect script and dependency declarations without execution
        shell: bash
        run: |
          set -euo pipefail
          timeout 150 python3 - <<'PY'
          import io,tarfile,urllib.request,hashlib,ast,sys,stat,pathlib,json
          URL="https://corebench.cs.princeton.edu/capsules/capsule-5975162.tar.gz"
          EXPECTED="5668df380ab8b4f2cb7e3724d6fb2d6d2151714d7a571545e6c256c74b598e48"
          with urllib.request.urlopen(urllib.request.Request(URL,headers={"User-Agent":"ASR-T0.16-static-only"}),timeout=20) as r:
              data=r.read(1048577)
          assert len(data)<=1048576,"compressed size exceeded 1MiB"
          actual=hashlib.sha256(data).hexdigest()
          assert actual==EXPECTED,f"Archive SHA differs from T0.15: {actual}"
          print("T016_ARCHIVE_SHA256_MATCH=true",flush=True)
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as tf:
              members=tf.getmembers()
              assert len(members)<=10000 and sum(m.size for m in members if m.isfile())<=10485760
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert not p.is_absolute() and ".." not in p.parts and not m.issym() and not m.islnk() and not m.isdev()
              print("T016_SAFE_METADATA_COUNT="+str(len(members)),flush=True)
              py_count=0
              unsafe_calls=[]
              for m in members:
                  if not m.isfile(): continue
                  base=m.name.rsplit("/",1)[-1].lower()
                  if base.endswith(".py") and m.size<=131072:
                      raw=tf.extractfile(m).read(131073)
                      try: tree=ast.parse(raw.decode("utf-8-sig"))
                      except (UnicodeError,SyntaxError): continue
                      py_count+=1
                      if base=="expsowithclassicalbenchmark02.py":
                          imports=sorted({n.names[0].name for n in ast.walk(tree) if isinstance(n,ast.Import)} | {n.module or "" for n in ast.walk(tree) if isinstance(n,ast.ImportFrom)})
                          calls=sorted({(n.func.id if isinstance(n.func,ast.Name) else n.func.attr if isinstance(n.func,ast.Attribute) else "dynamic") for n in ast.walk(tree) if isinstance(n,ast.Call)})
                          print("T016_TARGET_AST_IMPORTS="+",".join(imports)[:1000],flush=True)
                          print("T016_TARGET_AST_CALL_NAMES="+",".join(calls)[:1200],flush=True)
                          print("T016_TARGET_AST_NODE_COUNT="+str(len(list(ast.walk(tree)))),flush=True)
                          print("T016_TARGET_HAS_MAIN_GUARD="+str(any(isinstance(n,ast.If) for n in tree.body)),flush=True)
                      for n in ast.walk(tree):
                          if isinstance(n,ast.Call):
                              name=(n.func.id if isinstance(n.func,ast.Name) else n.func.attr if isinstance(n.func,ast.Attribute) else "")
                              if name in ("eval","exec","system","Popen","run","check_call","check_output","remove","rmtree"):
                                  unsafe_calls.append(name)
                  if base=="dockerfile":
                      raw=tf.extractfile(m).read(65536).decode("utf-8","replace")
                      lines=[line.strip() for line in raw.splitlines() if line.strip() and not line.lstrip().startswith("#")]
                      print("T016_DOCKERFILE_COMMANDS="+json.dumps([x[:250] for x in lines],ensure_ascii=True)[:2000],flush=True)
                  if base=="reproducing.md":
                      raw=tf.extractfile(m).read(65536).decode("utf-8","replace")
                      lines=[x.strip() for x in raw.splitlines() if any(k in x.lower() for k in ("python","install","pip","conda","runtime","cpu","gpu","run.sh","docker"))]
                      print("T016_REPRODUCING_RELEVANT_LINES="+json.dumps([x[:200] for x in lines[:16]],ensure_ascii=True)[:2000],flush=True)
                  if base in ("requirements.txt","environment.yml","environment.yaml","pyproject.toml"):
                      raw=tf.extractfile(m).read(65536).decode("utf-8","replace")
                      print("T016_DEP_FILE="+base+": "+json.dumps(raw.splitlines()[:30],ensure_ascii=True)[:1300],flush=True)
              print("T016_AST_PARSED_PY_FILES="+str(py_count),flush=True)
              print("T016_SUSPICIOUS_CALL_NAMES="+",".join(sorted(set(unsafe_calls))),flush=True)
              print("T016_CAPSULE_CODE_NOT_EXECUTED=true",flush=True)
          PY
      - name: Test original CORE scorer function on synthetic fixtures only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/t016-eval-venv"
          source "${RUNNER_TEMP}/t016-eval-venv/bin/activate"
          timeout 120 python -m pip install --quiet --only-binary=:all: numpy==1.26.4 scipy==1.13.1
          timeout 45 python - <<'PY'
          import ast,hashlib,urllib.request,math,subprocess
          import numpy as np
          from scipy.stats import t
          SRC="https://raw.githubusercontent.com/siegelz/core-bench/e32a2980e72fe6eb04ee04eb749458f570625663/benchmark/evaluations.py"
          raw=urllib.request.urlopen(SRC,timeout=15).read(100000)
          got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert got=="ecf1d77718c3a7e07bf48c37d7263656b5f7f06f",got
          src=ast.parse(raw)
          fn=next(n for n in src.body if isinstance(n,ast.FunctionDef) and n.name=="eval_result_json")
          module=ast.fix_missing_locations(ast.Module(body=[fn],type_ignores=[]))
          env={"Dict":dict,"np":np,"t":t,"math":math}
          exec(compile(module,"<pinned upstream CORE eval_result_json>","exec"),env,env)
          evaluate=env["eval_result_json"]
          ref=[{"numeric":10.0,"name":"alpha","vector":[1,2]} for _ in range(3)]
          passed=evaluate(ref,{"numeric":10.0,"name":"ALPHA","vector":[1,2]})
          rejected=evaluate(ref,{"numeric":10.01,"name":"ALPHA","vector":[1,2]})
          partial=evaluate(ref,{"numeric":10.0})
          variation=evaluate([{"numeric":float(x)} for x in (9,10,11)],{"numeric":10.0})
          assert passed["correct_written_answers"]==3 and passed["total_written_questions"]==3,passed
          assert rejected["correct_written_answers"]==2 and rejected["total_written_questions"]==3,rejected
          assert partial["correct_written_answers"]==1,partial
          assert variation["correct_written_answers"]==1,variation
          print("T016_ORIGINAL_SCORER_BLOB_VERIFIED=true")
          print("T016_SYNTHETIC_CASES=4")
          print("T016_SYNTHETIC_SCORER_ALL_PASS=true")
          # Boundary fixture: never send reference values to agent; this tests projection, NOT OS isolation.
          task={"task_prompt":"synthetic only","results":[{"private_canary":"DO_NOT_SEND"}],"capsule_id":"fake"}
          projection={"task_prompt":task["task_prompt"],"question_keys":["numeric","name","vector"]}
          assert "results" not in projection and "DO_NOT_SEND" not in str(projection)
          print("T016_NO_GOLD_PROJECTION_SYNTHETIC_PASS=true")
          try:
              subprocess.run(["sleep","2"],check=True,timeout=0.3)
              raise AssertionError("watchdog failed")
          except subprocess.TimeoutExpired:
              print("T016_TIMEOUT_WATCHDOG_SYNTHETIC_PASS=true",flush=True)
          print("T016_NO_REAL_GOLD_AND_NO_CAPSULE_CODE_RUN=true",flush=True)
          PY
