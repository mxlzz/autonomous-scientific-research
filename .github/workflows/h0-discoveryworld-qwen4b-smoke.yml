name: H0 T0.13 one bounded local Qwen3 4B actionability probe
on:
  push:
    paths:
      - .github/workflows/h0-discoveryworld-qwen4b-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: h0-t013-one-4b-probe
  cancel-in-progress: true

jobs:
  bounded-technical-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      HF_TOKEN: ""
      H0_MODEL_ID: qwen3:4b
    steps:
      - name: Fetch exact source; test validator and oracle boundary BEFORE model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user uv==0.13.9
          "$HOME/.local/bin/uv" python install 3.9
          git init -q "$RUNNER_TEMP/t013-project"
          git -C "$RUNNER_TEMP/t013-project" fetch -q --depth 1 https://github.com/mxlzz/autonomous-scientific-research.git e8973823e1058f2cbe0ffe4cea391c8302225835
          git -C "$RUNNER_TEMP/t013-project" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/t013-project" rev-parse HEAD)" = e8973823e1058f2cbe0ffe4cea391c8302225835
          git init -q "$RUNNER_TEMP/t013-dw"
          git -C "$RUNNER_TEMP/t013-dw" fetch -q --depth 1 https://github.com/allenai/discoveryworld.git fd591323920be0d3786ef350955de1945aa571e5
          git -C "$RUNNER_TEMP/t013-dw" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/t013-dw" rev-parse HEAD)" = fd591323920be0d3786ef350955de1945aa571e5
          "$HOME/.local/bin/uv" venv --python 3.9 "$RUNNER_TEMP/t013-venv"
          timeout 180 "$HOME/.local/bin/uv" pip install --python "$RUNNER_TEMP/t013-venv/bin/python" "$RUNNER_TEMP/t013-dw" > "$RUNNER_TEMP/t013-install-private.log" 2>&1
          "$HOME/.local/bin/uv" pip freeze --python "$RUNNER_TEMP/t013-venv/bin/python" | sort > "$RUNNER_TEMP/t013-packages-private.txt"
          echo "T013_PKG_RESOLUTION_SHA256=$(sha256sum "$RUNNER_TEMP/t013-packages-private.txt" | awk '{print $1}')"
          "$RUNNER_TEMP/t013-venv/bin/python" "$RUNNER_TEMP/t013-project/scripts/h0_discoveryworld_text_bridge.py" --self-test
          echo "T013_VALIDATOR_GATE=reused_T011_pass"
          echo "T013_SOURCE_PINS=verified"
      - name: Inspect free host RAM and disk before any model pull
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,shutil
          ram_kb=int(next(x.split()[1] for x in open("/proc/meminfo") if x.startswith("MemTotal:")))
          disk=shutil.disk_usage(os.environ["RUNNER_TEMP"]).free
          print("T013_HOST_RAM_KIB="+str(ram_kb))
          print("T013_FREE_DISK_BYTES="+str(disk))
          if ram_kb < 10*1024*1024 or disk < 3*1024**3:
              raise SystemExit("T013_RESOURCE_PREFLIGHT_FAIL")
          print("T013_RESOURCE_PREFLIGHT=pass")
          PY
      - name: Start CPU-only Ollama and verify official Qwen3 4B manifest digest
        shell: bash
        run: |
          set -euo pipefail
          timeout 150 docker pull ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592 >/dev/null
          docker run -d --name t013-local-qwen --cpus=3 --memory=6g -p 127.0.0.1:11434:11434 ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592 >/dev/null
          for n in $(seq 1 35); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          timeout 180 docker exec t013-local-qwen ollama pull qwen3:4b > "$RUNNER_TEMP/t013-model-pull-private.log" 2>&1
          python3 - <<'PY'
          import urllib.request,json,os,re
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=10) as res:
              mm=next(x for x in json.load(res)["models"] if x["name"]=="qwen3:4b")
          digest=mm["digest"]
          if not re.fullmatch(r"[0-9a-f]{64}",digest) or not digest.startswith("359d7dd4bcda"):
              raise RuntimeError("T013_UNEXPECTED_MODEL_DIGEST")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("H0_MODEL_DIGEST="+digest+"\n")
          print("T013_MODEL_PIN_VERIFIED=true")
          print("T013_MODEL_DIGEST="+digest)
          print("T013_MODEL_SIZE_BYTES="+str(mm.get("size","unknown")))
          PY
      - name: Run at most four text-only actions and export sanitized metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t013-private"
          docker stats --format '{{.MemUsage}}' t013-local-qwen > "$RUNNER_TEMP/t013-private/docker-mem.log" 2>/dev/null &
          sampler=$!
          cd "$RUNNER_TEMP/t013-dw"
          echo "T013_EVAL_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          timeout 255 "$RUNNER_TEMP/t013-venv/bin/python" "$RUNNER_TEMP/t013-project/scripts/h0_discoveryworld_text_bridge.py" --run > "$RUNNER_TEMP/t013-private/controller.log" 2>&1
          rc=$?
          set -e
          kill "$sampler" >/dev/null 2>&1 || true
          wait "$sampler" 2>/dev/null || true
          echo "T013_EVAL_END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "T013_CONTROLLER_RC=$rc"
          echo "T013_DOCKER_OOM_KILLED=$(docker inspect t013-local-qwen --format='{{.State.OOMKilled}}' 2>/dev/null || echo unknown)"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"t013-private"/"docker-mem.log"
          maxima=0
          factors={"B":1,"KiB":1024,"MiB":1024**2,"GiB":1024**3,"KB":1000,"MB":1000**2,"GB":1000**3}
          for line in p.read_text().splitlines():
              m=re.match(r"\s*([0-9]+(?:\.[0-9]+)?)\s*([KMG]?i?B)\s*/",line)
              if m: maxima=max(maxima,int(float(m.group(1))*factors[m.group(2)]))
          print("T013_DOCKER_PEAK_SAMPLED_BYTES="+str(maxima if maxima else "unavailable"))
          PY
          if [ ! -f "$RUNNER_TEMP/t011-private/summary.json" ]; then
            echo "T013_SUMMARY_MISSING=true"
            echo "T013_CONTROLLER_LOG_SHA256=$(sha256sum "$RUNNER_TEMP/t013-private/controller.log" | awk '{print $1}')"
            exit 31
          fi
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"t011-private"/"summary.json"
          raw=p.read_bytes()
          s=json.loads(raw)
          t=s["stats"]
          print("T013_SANITIZED_SUMMARY_SHA256="+hashlib.sha256(raw).hexdigest())
          print("T013_OBSERVED_MODEL_DIGEST="+s["model_digest"])
          for k in ("llm_calls","action_attempts","valid_actions","invalid_actions","prompt_tokens","completion_tokens"):
              print("T013_"+k.upper()+"="+str(t[k]))
          for k in ("score_normalized","completed_successfully","elapsed_seconds","maxrss_kb","trajectory_audit","oracle_read_only_after_stop","llm_has_code_tools"):
              print("T013_"+k.upper()+"="+str(s[k]))
          print("T013_FAILURE_CATEGORIES="+",".join(s["failure_categories"]))
          print("T013_ACTION_TYPES="+json.dumps(t["action_types"],sort_keys=True))
          valid=(s["model_digest"]==os.environ["H0_MODEL_DIGEST"] and t["llm_calls"]>=1 and t["llm_calls"]<=6 and
              t["action_attempts"]<=4 and t["valid_actions"]>=1 and t["completion_tokens"]<=6*256 and
              s["oracle_read_only_after_stop"] is True and s["llm_has_code_tools"] is False)
          print("T013_TECHNICAL_ACTION_GATE="+("pass" if valid else "fail"))
          if not valid:raise SystemExit(34)
          PY
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo "T013_RAW_TRACE_UPLOADED=false"
      - name: Stop local model even on failure
        if: always()
        shell: bash
        run: |
          docker rm -f t013-local-qwen >/dev/null 2>&1 || true
          echo "T013_OLLAMA_STOPPED=true"
