name: H0 T0.51 offline original tool-category observability gate
on:
  push:
    paths:
      - .github/workflows/h0-t051-offline-tool-categories.yml
permissions:
  contents: read
concurrency:
  group: h0-t051-offline-category-verification
  cancel-in-progress: true
jobs:
  offline-categories:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout current source, no credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify prereg and tool category allowlist offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/T0.51-soft-budget-tool-category-telemetry-preregister-2026-11-21.md)" = 537dd96fa8c46cbfc1e7843b9167cc3096ab557f
          test "$(git hash-object scripts/h0_tool_categories_t051.py)" = e551860abe8fb925a66a27128cf9607c78d089eb
          python3 -m py_compile scripts/h0_tool_categories_t051.py
          python3 scripts/h0_tool_categories_t051.py --offline-test
          echo T051_OFFLINE_SOURCE_PINS_PASS=true
          echo T051_LLM_CALLS=0
          echo T051_API_PAID_USD=0
      - name: Verify patch on original published SciResearch harness and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t051-upstream"
          git clone -q --filter=blob:none --no-checkout https://github.com/Btwestyo/sciresearch-eval.git "$RUNNER_TEMP/t051-upstream"
          git -C "$RUNNER_TEMP/t051-upstream" fetch -q --depth 1 origin 9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0
          git -C "$RUNNER_TEMP/t051-upstream" checkout --detach -q 9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0
          test "$(git -C "$RUNNER_TEMP/t051-upstream" hash-object src/sciresearch_eval/agents/harness.py)" = 194a4b36caf4cd702caee34044ec457247644aee
          test "$(git -C "$RUNNER_TEMP/t051-upstream" hash-object src/sciresearch_eval/agents/tools.py)" = 7f2c6e73e4872267ef8bded61880cf620d016c8b
          python3 scripts/h0_tool_categories_t051.py --offline-test \
            --harness "$RUNNER_TEMP/t051-upstream/src/sciresearch_eval/agents/harness.py" \
            --tools "$RUNNER_TEMP/t051-upstream/src/sciresearch_eval/agents/tools.py"
          echo T051_NO_GOLD_NO_MODEL_NO_PRIVATE_ACCESS=true
          echo T051_ORIGINAL_SCORER_NOT_EXECUTED=true
