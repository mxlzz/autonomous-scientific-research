name: H0 T0.11 DiscoveryWorld safe JSON action bridge + local Qwen micro-smoke
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/h0-discoveryworld-local-llm-smoke.yml

permissions:
  contents: read
concurrency:
  group: h0-t011-local-json-smoke
  cancel-in-progress: true

jobs:
  gated-local-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      HF_TOKEN: ""
    steps:
      - name: Install exact bridge/upstream and PASS security tests before any model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user uv==0.13.9
          "$HOME/.local/bin/uv" python install 3.9
          git init -q "$RUNNER_TEMP/t011-project"
          git -C "$RUNNER_TEMP/t011-project" fetch -q --depth 1 https://github.com/mxlzz/autonomous-scientific-research.git 42f38b7901b0f7d714a8e919482628f5b57afb45
          git -C "$RUNNER_TEMP/t011-project" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/t011-project" rev-parse HEAD)" = 42f38b7901b0f7d714a8e919482628f5b57afb45
          git init -q "$RUNNER_TEMP/t011-dw"
          git -C "$RUNNER_TEMP/t011-dw" fetch -q --depth 1 https://github.com/allenai/discoveryworld.git fd591323920be0d3786ef350955de1945aa571e5
          git -C "$RUNNER_TEMP/t011-dw" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/t011-dw" rev-parse HEAD)" = fd591323920be0d3786ef350955de1945aa571e5
          "$HOME/.local/bin/uv" venv --python 3.9 "$RUNNER_TEMP/t011-venv"
          timeout 180 "$HOME/.local/bin/uv" pip install --python "$RUNNER_TEMP/t011-venv/bin/python" "$RUNNER_TEMP/t011-dw" > "$RUNNER_TEMP/t011-install-private.log" 2>&1
          "$HOME/.local/bin/uv" pip freeze --python "$RUNNER_TEMP/t011-venv/bin/python" | sort > "$RUNNER_TEMP/t011-packages-private.txt"
          echo "T011_PKG_RESOLUTION_SHA256=$(sha256sum "$RUNNER_TEMP/t011-packages-private.txt" | awk '{print $1}')"
          "$RUNNER_TEMP/t011-venv/bin/python" "$RUNNER_TEMP/t011-project/scripts/h0_discoveryworld_text_bridge.py" --self-test
          echo "T011_SOURCE_PINS=verified"
      - name: Launch only local CPU model after validator pass
        shell: bash
        run: |
          set -euo pipefail
          timeout 150 docker pull ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592 >/dev/null
          docker run -d --name t011-local-qwen --cpus=3 --memory=6g -p 127.0.0.1:11434:11434 ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592 >/dev/null
          for n in $(seq 1 35); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          timeout 150 docker exec t011-local-qwen ollama pull qwen3:0.6b > "$RUNNER_TEMP/t011-model-pull-private.log" 2>&1
          python3 - <<'PY'
          import urllib.request,json
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=10) as res:
              mm=next(x for x in json.load(res)["models"] if x["name"]=="qwen3:0.6b")
          assert mm["digest"]=="7df6b6e09427a769808717c0a93cadc4ae99ed4eb8bf5ca557c90846becea435"
          print("T011_MODEL_PIN_VERIFIED=true")
          PY
      - name: Use original environment with model's bounded text-only decisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t011-private"
          cd "$RUNNER_TEMP/t011-dw"
          echo "T011_EVAL_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          timeout 330 "$RUNNER_TEMP/t011-venv/bin/python" "$RUNNER_TEMP/t011-project/scripts/h0_discoveryworld_text_bridge.py" --run > "$RUNNER_TEMP/t011-private/controller.log" 2>&1
          rc=$?
          set -e
          echo "T011_CONTROLLER_RC=$rc"
          echo "T011_EVAL_END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ ! -f "$RUNNER_TEMP/t011-private/summary.json" ]; then
            echo "T011_SUMMARY_MISSING=true"
            echo "T011_CONTROLLER_ERROR_LOG_SHA256=$(sha256sum "$RUNNER_TEMP/t011-private/controller.log" | awk '{print $1}')"
            exit 31
          fi
          "$RUNNER_TEMP/t011-venv/bin/python" - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"t011-private"/"summary.json"
          raw=p.read_bytes();s=json.loads(raw);t=s["stats"]
          print("T011_SANITIZED_SUMMARY_SHA256="+hashlib.sha256(raw).hexdigest())
          for k in ("llm_calls","action_attempts","valid_actions","invalid_actions","prompt_tokens","completion_tokens"):
              print("T011_"+k.upper()+"="+str(t[k]))
          for k in ("score_normalized","completed_successfully","elapsed_seconds","maxrss_kb","trajectory_audit","oracle_read_only_after_stop","llm_has_code_tools"):
              print("T011_"+k.upper()+"="+str(s[k]))
          print("T011_FAILURE_CATEGORIES="+",".join(s["failure_categories"]))
          print("T011_ACTION_TYPES="+json.dumps(t["action_types"],sort_keys=True))
          print("T011_UUID_ARG_NOT_VISIBLE="+str(t["uuid_arg_not_visible"]))
          print("T011_ACTIONABLE_ID_TEST=passed_in_pre_model_gate")
          valid= t["llm_calls"]>=1 and t["llm_calls"]<=6 and t["action_attempts"]<=4 and t["valid_actions"]>=1 and t["completion_tokens"]<=6*256 and s["oracle_read_only_after_stop"] is True and s["llm_has_code_tools"] is False
          print("T011_LLM_ACTION_GATE="+("pass" if valid else "fail"))
          if not valid:raise SystemExit(34)
          PY
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo "T011_PRIVATE_WORLD_LOG_UPLOADED=false"
      - name: Stop local model, regardless of result
        if: always()
        shell: bash
        run: |
          docker rm -f t011-local-qwen >/dev/null 2>&1 || true
          echo "T011_OLLAMA_STOPPED=true"
