name: H0 C1 native tool-call smoke with local Qwen (public arithmetic)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/h0-c1-local-toolcall-smoke.yml
permissions:
  contents: read
jobs:
  c1-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      HF_TOKEN: ""
    steps:
      - name: Provision bounded Ollama CPU, pinned Qwen3 and original ReAct solver
        shell: bash
        run: |
          set -euo pipefail
          timeout 150 docker pull ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592 >/dev/null
          docker run -d --name h0-c1-smoke-model --cpus=3 --memory=6g -p 127.0.0.1:11434:11434 ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592 >/dev/null
          for n in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          timeout 150 docker exec h0-c1-smoke-model ollama pull qwen3:0.6b > "$RUNNER_TEMP/model-pull.log" 2>&1
          python3 - <<'PY'
          import urllib.request,json
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=10) as f:
              d=json.load(f)
          m=next(v for v in d["models"] if v["name"]=="qwen3:0.6b")
          assert m["digest"]=="7df6b6e09427a769808717c0a93cadc4ae99ed4eb8bf5ca557c90846becea435"
          print("MODEL_HASH_MATCH=true")
          PY
          python3 -m pip install --quiet --user uv==0.13.9
          "$HOME/.local/bin/uv" python install 3.11
          git init -q "$RUNNER_TEMP/c1-source"
          git -C "$RUNNER_TEMP/c1-source" fetch -q --depth 1 https://github.com/allenai/agent-baselines.git 2d426deac51ad74381319bcfd77066c6e222ba30
          git -C "$RUNNER_TEMP/c1-source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/c1-source" rev-parse HEAD)" = 2d426deac51ad74381319bcfd77066c6e222ba30
          "$HOME/.local/bin/uv" venv --python 3.11 "$RUNNER_TEMP/c1-env"
          timeout 150 "$HOME/.local/bin/uv" pip install --python "$RUNNER_TEMP/c1-env/bin/python" "$RUNNER_TEMP/c1-source/solvers/react" > "$RUNNER_TEMP/install.log" 2>&1
          "$RUNNER_TEMP/c1-env/bin/python" - <<'PY'
          import importlib.metadata as m
          assert m.version("astabench")=="0.5.3"
          assert m.version("inspect_ai")=="0.3.203"
          print("C1_PINNED=true")
          PY
      - name: Attempt original ReAct native tool calling on public arithmetic_demo sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          cd "$RUNNER_TEMP/c1-source"
          set +e
          timeout 150 "$RUNNER_TEMP/c1-env/bin/inspect" eval astabench/arithmetic_demo --solver agent_baselines/solvers/react/basic_agent.py@instantiated_basic_agent --model ollama/qwen3:0.6b --limit 1 --max-samples 1 --log-format json --log-dir "$RUNNER_TEMP/logs" -S max_steps=5 -S with_search_tools=0 -S with_table_editor=0 -S with_report_editor=0 -S with_thinking_tool=0 > "$RUNNER_TEMP/eval.log" 2>&1
          rc=$?
          set -e
          echo C1_ARITHMETIC_CLI_RC="$rc"
          "$RUNNER_TEMP/c1-env/bin/python" - <<'PY'
          import pathlib,json,hashlib,os
          paths=list((pathlib.Path(os.environ["RUNNER_TEMP"])/"logs").glob("*.json"))
          print("C1_ARITHMETIC_LOG_COUNT="+str(len(paths)))
          if len(paths)!=1:raise SystemExit(20)
          raw=paths[0].read_bytes(); d=json.loads(raw)
          print("C1_ARITHMETIC_LOG_SHA256="+hashlib.sha256(raw).hexdigest())
          print("C1_ARITHMETIC_STATUS="+str(d.get("status")))
          samples=d.get("samples") or []
          print("C1_ARITHMETIC_SAMPLE_COUNT="+str(len(samples)))
          if samples:
              e=samples[0].get("error")
              print("C1_ARITHMETIC_SAMPLE_ERROR="+str(bool(e)).lower())
              if isinstance(e,dict):
                  print("C1_ARITHMETIC_ERROR_KEYS="+",".join(sorted(str(k) for k in e.keys())))
                  print("C1_ARITHMETIC_ERROR_CLASS="+str(e.get("type","unknown"))[:100])
                  # Print only matches from an allowlist; never print message/traceback itself.
                  detail=" ".join(str(e.get(k,"")) for k in ("message","traceback","traceback_ansi","type"))
                  labels=("LimitExceededError","ToolError","ModelAPIError","NotFoundError","BadRequestError","TypeError","ValueError","RuntimeError","AssertionError","PermissionError","MaxSteps","context_length","tool_calls","docker","connection")
                  match=[v for v in labels if v.lower() in detail.lower()]
                  print("C1_ARITHMETIC_ERROR_CATEGORIES="+(",".join(match) if match else "unclassified"))
                  print("C1_ARITHMETIC_ERROR_DETAIL_SHA256="+hashlib.sha256(detail.encode()).hexdigest())
              for k,v in (samples[0].get("scores") or {}).items():
                  print("C1_ARITHMETIC_SCORER="+str(k))
                  value=v.get("value") if isinstance(v,dict) else None
                  if isinstance(value,(str,float,int,bool)):print("C1_ARITHMETIC_SCORE="+str(value))
          success=d.get("status")=="success" and len(samples)==1 and not samples[0].get("error")
          print("C1_ARITHMETIC_TECHNICAL_SUCCESS="+str(success).lower())
          if not success:raise SystemExit(21)
          PY
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Stop server
        if: always()
        shell: bash
        run: |
          docker rm -f h0-c1-smoke-model >/dev/null 2>&1 || true
          echo C1_CPU_SERVICE_STOPPED=true
