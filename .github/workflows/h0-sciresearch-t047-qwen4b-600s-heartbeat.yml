name: H0 T0.47 Qwen3 4B original science 600s with safe heartbeat
on:
  push:
    paths:
      - .github/workflows/h0-sciresearch-t047-qwen4b-600s-heartbeat.yml
permissions:
  contents: read
concurrency:
  group: h0-t047-one-600s-heartbeat-science
  cancel-in-progress: true
jobs:
  single-free-cpu-episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      HF_TOKEN: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      OLLAMA_API_KEY: ""
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout without persisting credentials and verify preregistration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin original science source and preregistered experimental instrument
        shell: bash
        run: |
          set -euo pipefail
          # Preregistered host headroom gate. Before any model/weights download.
          host_available_kib=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo)
          echo "T047_HOST_MEMAVAILABLE_KIB=$host_available_kib"
          if [ "$host_available_kib" -lt 10485760 ]; then
            echo T047_NO_GO_HOST_MEM_BELOW_10GIB=true
            exit 1
          fi
          host_disk=$(df -B1 --output=avail / | tail -n1 | tr -d ' ')
          echo "T047_HOST_DISKAVAILABLE_BYTES=$host_disk"
          if [ "$host_disk" -lt 8589934592 ]; then
            echo T047_NO_GO_HOST_DISK_BELOW_8GIB=true
            exit 1
          fi
          echo T047_HOST_RESOURCE_GATE_PASS=true
          python3 -m py_compile scripts/h0_sciresearch_qwen_t047.py scripts/h0_probe_shape_t034.py scripts/h0_tool_error_kind_t036.py scripts/h0_limit_guard_t038.py scripts/h0_cgroup_pressure_t047.py scripts/h0_science_cgroup_t047.py scripts/h0_heartbeat_censor_t046.py scripts/h0_qwen4b_preflight_t040.py scripts/h0_qwen4b_tool_probe_t041.py
          python3 scripts/h0_probe_shape_t034.py
          python3 scripts/h0_tool_error_kind_t036.py
          python3 scripts/h0_limit_guard_t038.py --self-test
          python3 scripts/h0_cgroup_pressure_t047.py --offline-test
          python3 scripts/h0_science_cgroup_t047.py --offline-test
          python3 scripts/h0_heartbeat_censor_t046.py --offline-test
          python3 scripts/h0_qwen4b_preflight_t040.py --offline-test
          python3 scripts/h0_qwen4b_tool_probe_t041.py --offline-test
          test "$(git hash-object experiments/T0.47-qwen4b-science-600s-heartbeat-preregister-2026-11-20.md)" = 9e94bec56a8e5337d945b67cb4bfe2f85aab7865
          test "$(git hash-object scripts/h0_sciresearch_qwen_t047.py)" = 5847c602a4b69c37e1ba7e536d25c70fa2310936
          test "$(git hash-object scripts/h0_probe_shape_t034.py)" = ee0c03b9e0a3d9f591bc50aae04da00a5d6d961c
          test "$(git hash-object scripts/h0_tool_error_kind_t036.py)" = b2877b75e030ec929586fcb358a402dab9875905
          test "$(git hash-object scripts/h0_limit_guard_t038.py)" = e2038970b985075f3c5b18e981919dff0b1886a5
          test "$(git hash-object scripts/h0_cgroup_pressure_t047.py)" = dc99b5a191f4d2cc43861adb3ea254c80a27cbf9
          test "$(git hash-object scripts/h0_science_cgroup_t047.py)" = b76561794ee441f7265eca21caf343ed19bdf6a5
          test "$(git hash-object scripts/h0_heartbeat_censor_t046.py)" = 0cea5d9239aec04ce4f646e555d68b4427a29445
          test "$(git hash-object scripts/h0_qwen4b_preflight_t040.py)" = 0794c903eb186d295ec890dbe231edc6429244f6
          test "$(git hash-object scripts/h0_qwen4b_tool_probe_t041.py)" = 1ad7e1928ad93a5f6e520280cb7b70c51ca58909
          cd "$RUNNER_TEMP"
          git clone --no-checkout --filter=blob:none --quiet https://github.com/Btwestyo/sciresearch-eval.git upstream
          cd upstream
          git fetch --quiet --depth=1 origin 9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0
          git checkout --detach --quiet 9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0
          test "$(git rev-parse HEAD)" = 9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0
          test "$(git hash-object src/sciresearch_eval/grader.py)" = 8194044d11b17b6d9d2b040a5115ff35bb798b64
          test "$(git hash-object src/sciresearch_eval/env.py)" = ef080f18d9b509c5fc8192186c868265ed04613d
          test "$(git hash-object src/sciresearch_eval/agents/harness.py)" = 194a4b36caf4cd702caee34044ec457247644aee
          test "$(git hash-object src/sciresearch_eval/agents/openai_backend.py)" = 62226f9e814af28593763281ed8cf5e25dc6cc5d
          test "$(git hash-object src/sciresearch_eval/agents/tools.py)" = 7f2c6e73e4872267ef8bded61880cf620d016c8b
          test "$(git hash-object tasks/dev/manifest.json)" = e12614f631e992aa7cd1e7bc910ca1be1bdc31b7
          python3 "$GITHUB_WORKSPACE/scripts/h0_heartbeat_censor_t046.py" --offline-test --source="$RUNNER_TEMP/upstream/src/sciresearch_eval/agents/harness.py"
          echo T047_UPSTREAM_SOURCE_PIN=true
          echo "T047_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo T047_PREREGISTERED_PROTOCOL_PIN=true
      - name: Prepare pinned evaluator wheels and two images with no API credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t047-wheels" "$RUNNER_TEMP/t047-site" "$RUNNER_TEMP/t047-results"
          chmod 777 "$RUNNER_TEMP/t047-wheels" "$RUNNER_TEMP/t047-site" "$RUNNER_TEMP/t047-results"
          python_img="python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
          model_img="ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592"
          timeout 120 docker pull "$python_img" >/dev/null
          timeout 120 docker pull "$model_img" >/dev/null
          echo T047_DOCKER_IMAGES_PINNED=true
          timeout 150 docker run --rm --network bridge --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 96 --cpus 1 --memory 1g \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=384m,mode=1777 \
            --mount "type=bind,src=$RUNNER_TEMP/t047-wheels,dst=/wheels" \
            "$python_img" python -m pip download --no-cache-dir --only-binary=:all: --no-deps \
              -d /wheels numpy==2.4.6 scipy==1.17.1 pytest==9.1.1 \
              iniconfig==2.3.1 packaging==26.3 pluggy==1.7.0 pygments==2.21.0 >/dev/null
          python3 - <<'PY'
          import hashlib,os,pathlib
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"t047-wheels"
          expected={
            "iniconfig-2.3.1-py3-none-any.whl":"9121e2c1fdb355232495be3194c8dfe87ccc2d5dee45947b78e68f499790d7a7",
            "numpy-2.4.6-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl":"90f9849678c75fe7afa2d348ac842c168b0a4d3d61919687216dfc547976d853",
            "packaging-26.3-py3-none-any.whl":"d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
            "pluggy-1.7.0-py3-none-any.whl":"7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec",
            "pygments-2.21.0-py3-none-any.whl":"2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9",
            "pytest-9.1.1-py3-none-any.whl":"37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c",
            "scipy-1.17.1-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl":"02ae3b274fde71c5e92ac4d54bc06c42d80e399fec704383dcd99b301df37458"
          }
          got={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in d.glob("*.whl")}
          assert got==expected,"wheels differ from T0.21, stop"
          print("T047_ALL_WHEELS_PINNED=true",flush=True)
          PY
      - name: Download one pinned model in temporary preparation network, then stop
        shell: bash
        run: |
          set -euo pipefail
          img="ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592"
          vol="h0t047-model-$GITHUB_RUN_ID"
          prep="h0t047-prep-$GITHUB_RUN_ID"
          echo "T047_MODEL_STAGE=PREP"
          docker volume create "$vol" >/dev/null
          docker run -d --name "$prep" --network bridge -p 127.0.0.1:11434:11434 \
            --cpus 2 --memory 8g --pids-limit 96 --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=384m,mode=1777 \
            --mount "type=volume,src=$vol,dst=/root/.ollama" "$img" >/dev/null
          for n in $(seq 1 35); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          timeout 420 docker exec "$prep" ollama pull qwen3:4b-instruct-2507-q4_K_M > "$RUNNER_TEMP/t047-model-pull-private.log" 2>&1
          # Validate model identity/tools first, without generating.
          python3 scripts/h0_qwen4b_preflight_t040.py --inspect-runtime
          echo T047_PROBE_PHASE=ONE_SYNTHETIC_TOOL_AND_CGROUP_GATE
          set +e
          timeout --signal=TERM --kill-after=5s 145 python3 scripts/h0_cgroup_pressure_t047.py \
            --monitor --container "$prep" > "$RUNNER_TEMP/t047-probe-allowlist.log"
          probe_rc=$?
          set -e
          echo "T047_HOST_PROBE_MONITOR_RC=$probe_rc"
          # Only allowlisted instrumentation output; no raw model or private text.
          grep '^T047_' "$RUNNER_TEMP/t047-probe-allowlist.log" || true
          if [ "$probe_rc" -eq 0 ] &&
             grep -qx 'T047_MEMORY_DECISION="ONLY_SHORT_PROBE_PASS_LONG_SCIENCE_UNVERIFIED"' "$RUNNER_TEMP/t047-probe-allowlist.log" &&
             grep -qx 'T047_PROBE_PROBE_PASS=true' "$RUNNER_TEMP/t047-probe-allowlist.log"; then
            echo T047_PREP_TOOL_AND_MEMORY_GATE=true
            echo "T047_SCIENCE_ALLOWED=yes" >> "$GITHUB_ENV"
          else
            echo T047_PREP_TOOL_AND_MEMORY_GATE=false
            echo T047_DECISION=NO_GO_BEFORE_SCIENCE
          fi
          docker rm -f "$prep" >/dev/null
          echo T047_PREP_INTERNET_MODEL_SERVER_REMOVED=true
      - name: Verify private-data mount separation in internal network and run once
        if: env.T047_SCIENCE_ALLOWED == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${T047_SCIENCE_ALLOWED:-no}" != "yes" ]; then
            echo T047_STATUS=NO_GO_PREP_GATE_NOT_VERIFIED
            echo T047_SCIENCE_STATUS=NOT_STARTED
            exit 1
          fi
          echo T047_PREP_GATE_READBACK_VERIFIED=true
          # Allow 600 seconds of science plus >=60 seconds for mounts, readback and cleanup.
          now=$(date +%s)
          if [ -z "${T047_JOB_STARTED_EPOCH:-}" ] || ! [[ "$T047_JOB_STARTED_EPOCH" =~ ^[0-9]+$ ]]; then
            echo T047_NO_GO_JOB_START_UNVERIFIED=true
            exit 0
          fi
          elapsed=$((now-T047_JOB_STARTED_EPOCH))
          remaining=$((900-elapsed))
          echo "T047_JOB_SECONDS_REMAINING_AT_SCIENCE_GATE=$remaining"
          if [ "$remaining" -lt 660 ]; then
            echo T047_NO_GO_INSUFFICIENT_JOB_TIME=true
            echo T047_SCIENCE_STATUS=NOT_STARTED
            exit 0
          fi
          echo T047_SCIENCE_TIME_GATE_PASS=true
          py="python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
          ollama="ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592"
          vol="h0t047-model-$GITHUB_RUN_ID"
          net="h0t047-private-$GITHUB_RUN_ID"
          model="h0t047-actor-$GITHUB_RUN_ID"
          evaluator="h0t047-evaluator-$GITHUB_RUN_ID"
          docker network create --internal --driver bridge "$net" >/dev/null
          docker create --name "$model" --network "$net" --network-alias ollama \
            --cpus 2 --memory 8g --pids-limit 96 --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --env OLLAMA_HOST=0.0.0.0:11434 --env OLLAMA_CONTEXT_LENGTH=4096 \
            --env OLLAMA_NUM_PARALLEL=1 --env OLLAMA_MAX_LOADED_MODELS=1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=384m,mode=1777 \
            --mount "type=volume,src=$vol,dst=/root/.ollama" \
            "$ollama" >/dev/null
          docker create --name "$evaluator" --network "$net" \
            --cpus 1 --memory 1g --pids-limit 96 --cap-drop ALL \
            --security-opt no-new-privileges --read-only --user 65534:65534 \
            --workdir /project --tmpfs /tmp:rw,nosuid,nodev,size=384m,mode=1777 \
            --env PYTHONDONTWRITEBYTECODE=1 --env PYTHONHASHSEED=0 \
            --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 \
            --env MKL_NUM_THREADS=1 --env T047_MOUNT_GATE_VERIFIED=yes --env T047_SCIENCE_ALLOWED=yes \
            --mount "type=bind,src=$RUNNER_TEMP/upstream,dst=/project,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/h0_sciresearch_qwen_t047.py,dst=/controller/t047.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/h0_limit_guard_t038.py,dst=/controller/h0_limit_guard_t038.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/h0_heartbeat_censor_t046.py,dst=/controller/h0_heartbeat_censor_t046.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/h0_tool_error_kind_t036.py,dst=/controller/tool_error_kind_t047.py,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/t047-wheels,dst=/wheels,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/t047-site,dst=/site" \
            --mount "type=bind,src=$RUNNER_TEMP/t047-results,dst=/results" \
            "$py" sh -c '
              python -m pip install --no-index --no-deps --find-links=/wheels --target=/site \
                numpy==2.4.6 scipy==1.17.1 pytest==9.1.1 \
                iniconfig==2.3.1 packaging==26.3 pluggy==1.7.0 pygments==2.21.0 \
                > /tmp/pip.log 2>&1
              result=$?
              if [ "$result" -ne 0 ]; then echo T047_OFFLINE_INSTALL_EXIT="$result"; exit "$result"; fi
              echo T047_OFFLINE_INSTALL_PASS=true
              PYTHONPATH=/site:/project/src python /controller/t047.py
            ' >/dev/null
          docker inspect "$model" "$evaluator" > "$RUNNER_TEMP/t047-inspect-private.json"
          docker network inspect "$net" > "$RUNNER_TEMP/t047-network-private.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ["RUNNER_TEMP"])
          model,evaluator=json.loads((d/"t047-inspect-private.json").read_text())
          network=json.loads((d/"t047-network-private.json").read_text())[0]
          assert network["Internal"] is True
          assert set(model["NetworkSettings"]["Networks"])==set(evaluator["NetworkSettings"]["Networks"])=={network["Name"]}
          for obj,mem,nano in ((model,8*1024**3,2000000000),(evaluator,1*1024**3,1000000000)):
              conf=obj["HostConfig"]
              assert conf["ReadonlyRootfs"] is True and conf["Privileged"] is False
              assert "ALL" in conf["CapDrop"] and "no-new-privileges" in conf["SecurityOpt"]
              assert conf["Memory"]==mem and conf["NanoCpus"]==nano
              assert all(m["Destination"]!="/var/run/docker.sock" for m in obj["Mounts"])
          assert len(model["Mounts"])==1
          assert model["Mounts"][0]["Type"]=="volume" and model["Mounts"][0]["Destination"]=="/root/.ollama"
          assert {m["Destination"] for m in evaluator["Mounts"]}=={"/project","/controller/t047.py","/controller/h0_limit_guard_t038.py","/controller/h0_heartbeat_censor_t046.py","/controller/tool_error_kind_t047.py","/wheels","/site","/results"}
          assert all(m["RW"] is False for m in evaluator["Mounts"] if m["Destination"] in ("/project","/controller/t047.py","/controller/h0_limit_guard_t038.py","/controller/h0_heartbeat_censor_t046.py","/controller/tool_error_kind_t047.py","/wheels"))
          print("T047_ACTOR_FILESYSTEM_MOUNTS_ONLY_MODEL_WEIGHTS=true",flush=True)
          print("T047_EVALUATOR_PRIVATE_MOUNT_UNSHARED=true",flush=True)
          print("T047_NETWORK_INTERNAL_ONLY=true",flush=True)
          print("T047_COMBINED_LIMIT_CPU_3_MEM_9G=true",flush=True)
          PY
          docker start "$model" >/dev/null
          for n in $(seq 1 30); do
            if docker exec "$model" ollama list >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo T047_RUN_PHASE=ORIGINAL_DEV_SCIENCE_AFTER_SEPARATE_GATE
          set +e
          timeout --signal=TERM --kill-after=10s 630 python3 scripts/h0_science_cgroup_t047.py --actor "$model" --evaluator "$evaluator" --deadline-sec 600
          rc=$?
          set -e
          echo "T047_SCIENCE_MONITOR_EXIT_RC=$rc"
          if [ -f "$RUNNER_TEMP/t047-results/t047_summary.json" ]; then
            python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"t047-results/t047_summary.json"
          b=p.read_bytes(); s=json.loads(b)
          assert s["upstream_commit"]=="9d391b3aa8daf8d0b944acda12c7f8b089a1d8e0"
          assert s["model"]=="qwen3:4b-instruct-2507-q4_K_M" and s["api_paid_usd"]==0
          assert s["score"] is None or isinstance(s["score"],dict)
          print("T047_SAVED_SUMMARY_SHA256="+hashlib.sha256(b).hexdigest(),flush=True)
          print("T047_RECORDED_STATUS="+s["status"],flush=True)
          print("T047_RECORDED_SCIENCE_STATUS="+s["science_status"],flush=True)
          print("T047_RECORDED_MODEL_CALLS="+str(s["model_calls"]),flush=True)
          print("T047_RECORDED_PROBE_PASS="+str(s["probe_pass"]),flush=True)
          print("T047_JSON_READBACK_PASS=true",flush=True)
          PY
          else
            echo T047_SUMMARY_MISSING=true
            echo T047_SCORE_NOT_OBSERVED=true
          fi
          echo T047_PRIVATE_TRANSCRIPT_UPLOADED=false
      - name: Cleanup ephemeral containers and private model volume
        if: always()
        shell: bash
        run: |
          docker rm -f "h0t047-prep-$GITHUB_RUN_ID" "h0t047-actor-$GITHUB_RUN_ID" "h0t047-evaluator-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          docker network rm "h0t047-private-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          docker volume rm -f "h0t047-model-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          echo T047_EPHEMERAL_ACTOR_AND_EVALUATOR_REMOVED=true
